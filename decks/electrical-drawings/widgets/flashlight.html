<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>懐中電灯: 実物と回路図</title>
<style>/* electrical-drawings のウィジェット共通(方眼紙と青図のテーマ)。1em = iframe の幅 / --cols(各ウィジェットが決める)。
   青 = さわれる所・選択、赤橙 = 電気が来ている所、黄 = 強調、緑 = 正解・GND */
:root {
  --paper: #FCFBF7; --card: #FFFFFF; --raise: #EDF2F7; --line: #C9D3DE; --ink: #1E2733; --sub: #5B6676; --mute: #8A94A3;
  --blue: #1E6BB8; --navy: #17375E; --red: #D9480F; --amber: #F2B705; --green: #2F8F5B; --violet: #8A5CC2;
  --blue-soft: rgba(30, 107, 184, .12); --red-soft: rgba(217, 72, 15, .12); --amber-soft: rgba(242, 183, 5, .28); --green-soft: rgba(47, 143, 91, .14);
  --grid: rgba(30, 107, 184, .07);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: transparent; }
body { color: var(--ink); font: 400 calc(100vw / var(--cols, 40)) / 1.45 "BIZ UDPGothic", "Yu Gothic UI", "Meiryo UI", sans-serif; overflow: hidden; }
.frame { height: 100%; display: flex; flex-direction: column; gap: .55em; padding: .7em .85em .8em; border: 2px solid var(--blue); border-radius: .6em;
  background-color: var(--paper); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 1em 1em; }
header { display: flex; align-items: center; gap: .6em; min-height: 1.5em; }
.tag { font-size: .8em; font-weight: 700; letter-spacing: .06em; color: var(--blue); white-space: nowrap; }
.tag::before { content: ""; display: inline-block; width: .6em; height: .6em; margin-right: .45em; border-radius: 50%; background: currentColor; vertical-align: .02em; }
.chip { margin-left: auto; font-size: .72em; padding: .12em .7em; border-radius: 999px; background: var(--raise); color: var(--sub); white-space: nowrap; }
.num, output { font-family: Consolas, "Cascadia Mono", monospace; font-variant-numeric: tabular-nums; }
button { font: inherit; color: var(--ink); cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.btn { border: 1.5px solid var(--line); background: var(--card); border-radius: 999px; padding: .25em .9em; font-size: .85em; font-weight: 700; white-space: nowrap; }
.btn:hover { border-color: var(--blue); color: var(--blue); }
.btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn.primary:hover { filter: brightness(1.1); color: #fff; }
.btn[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }
.btn:disabled { opacity: .45; cursor: default; }
.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 999px; overflow: hidden; flex: none; background: var(--card); }
.seg button { border: 0; background: transparent; padding: .22em .8em; font-size: .82em; color: var(--sub); white-space: nowrap; }
.seg button + button { border-left: 1.5px solid var(--line); }
.seg button.on { background: var(--blue); color: #fff; font-weight: 700; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: .45em .8em; }
label { display: inline-flex; align-items: center; gap: .45em; font-size: .85em; color: var(--sub); white-space: nowrap; }
label b { color: var(--ink); }
input[type=range] { width: 8em; accent-color: var(--blue); margin: 0; }
output { color: var(--ink); min-width: 3.2em; display: inline-block; font-weight: 700; }
.tile { background: var(--card); border: 1.5px solid var(--line); border-radius: .45em; padding: .3em .6em .35em; min-width: 0; }
.tile .k { font-size: .72em; color: var(--sub); white-space: nowrap; }
.tile .v { font-size: 1.25em; font-weight: 700; line-height: 1.2; white-space: nowrap; }
.hint { font-size: .85em; color: var(--ink); line-height: 1.55; background: var(--card); border-left: .3em solid var(--blue); border-radius: .3em; padding: .4em .7em; }
.hint b { color: var(--blue); }
.hint.warn { border-left-color: var(--red); }
.hint.warn b { color: var(--red); }
.hint.ok { border-left-color: var(--green); }
.hint.ok b { color: var(--green); }
.red { color: var(--red); } .blue { color: var(--blue); } .green { color: var(--green); } .sub { color: var(--sub); } .amber { color: #B98900; }
svg { display: block; }
svg text { font-family: "BIZ UDPGothic", "Yu Gothic UI", "Meiryo", sans-serif; }
.panel { background: var(--card); border: 1.5px solid var(--line); border-radius: .5em; min-width: 0; min-height: 0; position: relative; }
.panel > .ptitle { position: absolute; left: .55em; top: .3em; font-size: .72em; font-weight: 700; color: var(--sub); letter-spacing: .05em; }
@keyframes flow { to { stroke-dashoffset: -16; } }
.flow { stroke-dasharray: 2 14; stroke-linecap: round; animation: flow .6s linear infinite; }
@media (prefers-reduced-motion: reduce) { .flow { animation: none; } }

:root { --cols: 40; }
.views { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: .6em; }
.views .panel svg { width: 100%; height: 100%; }
.part { cursor: pointer; }
.part .halo { fill: transparent; stroke: none; rx: 8; }
.part.hi .halo { fill: var(--amber-soft); stroke: var(--amber); stroke-width: 1.5; stroke-dasharray: 4 3; }
.sch { color: var(--ink); }
.sch .live { color: var(--red); }
.hint { min-height: 4.6em; }
.found { display: flex; flex-wrap: wrap; gap: .3em .45em; align-items: center; font-size: .74em; color: var(--sub); }
.found span.f { padding: .08em .6em; border-radius: 999px; border: 1.5px dashed var(--line); background: var(--card); white-space: nowrap; }
.found span.f.got { border-style: solid; border-color: var(--green); color: var(--green); font-weight: 700; background: var(--green-soft); }
.flowg { color: #FFB000; } .flowg polyline { stroke-width: 3; } .flowg.rev polyline { animation-direction: reverse; }
.wirehit { stroke: transparent; stroke-width: 16; fill: none; cursor: pointer; }
</style></head><body><div class="frame">
<header><span class="tag">さわれる図 01 · 懐中電灯</span><span class="chip">実物 ⇄ 回路図</span></header>
<div class="views">
  <div class="panel"><span class="ptitle">実物(実体図)</span><svg id="real" viewBox="0 0 300 250" aria-label="懐中電灯の実物の絵"></svg></div>
  <div class="panel"><span class="ptitle">回路図</span><svg id="sch" class="sch" viewBox="0 0 300 250" aria-label="懐中電灯の回路図"></svg></div>
</div>
<div class="hint" id="hint"></div>
<div class="found" id="found"></div>
<div class="controls">
  <button class="btn primary" id="sw" aria-pressed="false">スイッチを入れる</button>
  <button class="btn" id="cut" aria-pressed="false">✂ 線を切る</button>
  <button class="btn" id="rev" aria-pressed="false">⇅ 電池を逆に</button>
  <div class="seg" id="mode"><button data-v="lamp" class="on" aria-pressed="true">ランプ</button><button data-v="led" aria-pressed="false">LED</button></div>
</div>
</div>
<script>"use strict";
// electrical-drawings のウィジェット共通: 要素の取得、切り替えボタン、乱数、状態の保存と復元(deck-studio:widget-state / widget-restore)
const $ = (id) => document.getElementById(id);
function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function segment(el, onPick) {
  el.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => { setSeg(el, b.dataset.v); onPick(b.dataset.v); }));
}
function setSeg(el, v) { el.querySelectorAll("button").forEach((b) => { const on = b.dataset.v === String(v); b.classList.toggle("on", on); b.setAttribute("aria-pressed", String(on)); }); }
// 押している間だけ ON になるボタン(マウス・タッチ・Space / Enter)
function momentary(el, onChange) {
  let down = false;
  const set = (v) => { if (down === v) return; down = v; el.classList.toggle("down", v); el.setAttribute("aria-pressed", String(v)); onChange(v); };
  el.addEventListener("pointerdown", (e) => { e.preventDefault(); el.setPointerCapture?.(e.pointerId); set(true); });
  for (const t of ["pointerup", "pointercancel", "lostpointercapture"]) el.addEventListener(t, () => set(false));
  el.addEventListener("keydown", (e) => { if ((e.key === " " || e.key === "Enter") && !e.repeat) { e.preventDefault(); set(true); } });
  el.addEventListener("keyup", (e) => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); set(false); } });
  el.addEventListener("blur", () => set(false));
  return { set, get: () => down };
}
let publishing = false;
function publish(state) { if (publishing && parent !== window) parent.postMessage({ type: "deck-studio:widget-state", state }, "*"); }
function onRestore(fn) {
  window.addEventListener("message", (e) => {
    if (e.source !== parent || e.data?.type !== "deck-studio:widget-restore" || !e.data.state) return;
    const p = publishing; publishing = false; fn(e.data.state); publishing = p;
  });
}
function ready() { publishing = true; if (parent !== window) parent.postMessage({ type: "deck-studio:widget-ready" }, "*"); }

// 電気図記号(JIS C 0617 / IEC 60617 に沿った、教材用の描き方)を SVG の文字列で作る。
// ウィジェット(/*INC:_sym.js*/)と資料の図版(tools/create-electrical-assets.mjs)で共有する。
// 2 端子の記号は横向きで、端子は (0,0) と (60,0)。線の色は currentColor(CSS の color で変わる)。
// 接点の向き: a 接点は可動片が上へ浮く、b 接点は可動片が下へ傾いて固定側の短い線に触れる(IEC の縦向きの記号を右へ 90° 回した形)。
const SYM = (() => {
  const FONT = '"BIZ UDPGothic", "Yu Gothic UI", "Meiryo", sans-serif';
  const r2 = (v) => Math.round(v * 100) / 100;
  const P = (d, extra = "") => `<path d="${d}"${extra}/>`;
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  // 塗りつぶした矢じり(x2, y2 が先端)
  function head(x1, y1, x2, y2, s = 6) {
    const a = Math.atan2(y2 - y1, x2 - x1), w = s * 0.5;
    const bx = x2 - s * Math.cos(a), by = y2 - s * Math.sin(a);
    return `<path d="M${r2(x2)} ${r2(y2)}L${r2(bx - w * Math.sin(a))} ${r2(by + w * Math.cos(a))}L${r2(bx + w * Math.sin(a))} ${r2(by - w * Math.cos(a))}Z" fill="currentColor" stroke="none"/>`;
  }
  const arrow = (x1, y1, x2, y2, s = 6) => {
    const a = Math.atan2(y2 - y1, x2 - x1);
    return P(`M${r2(x1)} ${r2(y1)}L${r2(x2 - s * 0.7 * Math.cos(a))} ${r2(y2 - s * 0.7 * Math.sin(a))}`) + head(x1, y1, x2, y2, s);
  };
  const txt = (x, y, s, size = 14, extra = "") =>
    `<text x="${r2(x)}" y="${r2(y)}" font-size="${size}" text-anchor="middle" dominant-baseline="central" fill="currentColor" stroke="none" font-family='${FONT}'${extra}>${esc(s)}</text>`;
  const circ = (cx, cy, r, extra = "") => `<circle cx="${r2(cx)}" cy="${r2(cy)}" r="${r2(r)}"${extra}/>`;
  const rect = (x, y, w, h, extra = "") => `<rect x="${r2(x)}" y="${r2(y)}" width="${r2(w)}" height="${r2(h)}"${extra}/>`;
  const bumps = (n, dx, dy, sweep) => Array.from({ length: n }, () => `a4.5 4.5 0 0 ${sweep} ${dx} ${dy}`).join("");
  const plus = (x, y, s = 3) => P(`M${x - s} ${y}H${x + s}M${x} ${y - s}V${y + s}`, ' stroke-width="1.6"');
  const minus = (x, y, s = 3) => P(`M${x - s} ${y}H${x + s}`, ' stroke-width="1.6"');
  const diodeBody = () => P("M0 0H22M38 0H60M38 -10V10") + P("M22 -10L38 0L22 10Z", ' fill="currentColor"');
  const resBody = (old) => (old ? P("M0 0H14L16.67 -7L22 7L27.33 -7L32.67 7L38 -7L43.33 7L46 0H60") : P("M0 0H15M45 0H60") + rect(15, -6, 30, 12));

  // 接点。closed は「いま閉じているか」ではなく可動片の位置: a 接点は押されると閉じ、b 接点は押されると開く
  // 閉じた a 接点は線に埋もれないよう、接点の位置に小さな点を打つ(動きを見せる図のため)
  const shut = () => circ(20, 0, 2.8, ' fill="currentColor" stroke="none"') + circ(40, 0, 2.8, ' fill="currentColor" stroke="none"');
  function contactA(on) { return P("M0 0H20M40 0H60") + (on ? P("M20 0L40 0", ' stroke-width="3.2"') + shut() : P("M20 0L41 -12")); }
  function contactB(on) {
    // on = 動作した(押された・コイルに電気が来た)
    const end = on ? [20 + 24 * Math.cos(0.7), 24 * Math.sin(0.7)] : [44, 10];
    return P("M0 0H20M40 0H60M40 0V8") + P(`M20 0L${r2(end[0])} ${r2(end[1])}`);
  }
  // 押しボタンの操作部(点線の軸と頭)。y は可動片の中央の高さ
  function pusher(y) {
    const top = y - 16;
    return P(`M30 ${r2(y - 1)}V${r2(top)}`, ' stroke-dasharray="3 2.5"') + P(`M24 ${r2(top + 3)}V${r2(top)}H36V${r2(top + 3)}`);
  }

  const shapes = {
    res: (o) => resBody(o.old),
    vres: (o) => resBody(o.old) + arrow(17, 14, 44, -14, 7),
    pot: (o) => resBody(o.old) + P("M30 -24V-12") + head(30, -24, 30, o.old ? -8 : -6, 7),
    ldr: (o) => resBody(o.old) + arrow(14, -24, 24, -12, 6) + arrow(24, -26, 34, -14, 6),
    cap: () => P("M0 0H26M34 0H60M26 -12V12M34 -12V12"),
    ecap: () => P("M0 0H26M34 0H60M26 -12V12M34 -12V12") + plus(18, -13),
    vcap: () => P("M0 0H26M34 0H60M26 -12V12M34 -12V12") + arrow(17, 14, 44, -14, 7),
    ind: () => P(`M0 0H12${bumps(4, 9, 0, 1)}H60`),
    xfmr: () => P(`M0 -18H20${bumps(4, 0, 9, 1)}H0M60 -18H40${bumps(4, 0, 9, 0)}H60M28 -20V20M32 -20V20`),
    diode: () => diodeBody(),
    led: () => diodeBody() + arrow(28, -13, 37, -22, 6) + arrow(35, -10, 44, -19, 6),
    pd: () => diodeBody() + arrow(39, -24, 30, -15, 6) + arrow(46, -20, 37, -11, 6),
    zener: () => P("M0 0H22M38 0H60M34 -13L38 -10V10L42 13") + P("M22 -10L38 0L22 10Z", ' fill="currentColor"'),
    npn: () => circ(31, 0, 19) + P("M0 0H22M22 -12V12M22 -6L38 -16V-30M22 6L38 16V30") + head(22, 6, 37, 15.4, 7),
    pnp: () => circ(31, 0, 19) + P("M0 0H22M22 -12V12M22 -6L38 -16V-30M22 6L38 16V30") + head(38, 16, 23.5, 7, 7),
    nmos: () => circ(29, 0, 19) + P("M0 6H16M16 -12V12M22 -14V-8M22 -3V3M22 8V14M22 -11H38V-30M22 11H38V30M38 0V11") + arrow(38, 0, 23, 0, 6),
    opamp: () => P("M10 -26L10 26L56 0ZM0 -12H10M0 12H10M56 0H70") + minus(17, -12) + plus(17, 12),
    lamp: () => P("M0 0H18M42 0H60") + circ(30, 0, 12) + P("M21.5 -8.5L38.5 8.5M38.5 -8.5L21.5 8.5"),
    motor: () => P("M0 0H16M44 0H60") + circ(30, 0, 14) + txt(30, 0.5, "M", 15, ' font-weight="700"'),
    meter: (o) => P("M0 0H16M44 0H60") + circ(30, 0, 14) + txt(30, 0.5, o.letter || "V", 15, ' font-weight="700"'),
    buzzer: () => P("M0 0H22M38 0H60M22 0V-12M38 0V-12") + P("M14 -12H46A16 16 0 0 1 14 -12Z"),
    acsrc: () => P("M0 0H18M42 0H60") + circ(30, 0, 12) + P("M22.5 0C25 -6 28 -6 30 0C32 6 35 6 37.5 0"),
    batt: () => P("M0 0H27M33 0H60M27 -13V13") + P("M33 -7V7", ' stroke-width="4.5"') + plus(19, -14),
    fuse: () => P("M0 0H60") + rect(15, -5, 30, 10),
    mccb: (o) => P("M0 0H20M40 0H60") + (o.on ? P("M20 0L40 0", ' stroke-width="3.2"') + shut() : P("M20 0L41 -12")) + P("M36.5 -3.5L43.5 3.5M43.5 -3.5L36.5 3.5"),
    swa: (o) => contactA(o.on),
    swb: (o) => contactB(o.on),
    swc: () => P("M0 0H20M40 -12H60M40 10H60M40 10V2") + P("M20 0L44 8.5"),
    pba: (o) => contactA(o.on) + pusher(o.on ? 0 : -6),
    pbb: (o) => contactB(o.on) + pusher(o.on ? 10 * Math.tan(0.7) : 4.2),
    coil: () => P("M0 0H18M42 0H60") + rect(18, -8, 24, 16),
    coilold: () => P("M0 0H17M43 0H60") + circ(30, 0, 13),
    gnd: () => P("M0 0V10M-12 10H12M-7.5 15.5H7.5M-3 21H3"),
    pe: () => P("M0 0V10M-12 10H12M-7.5 15.5H7.5M-3 21H3") + circ(0, 14, 16),
    chassis: () => P("M0 0V10M-12 10H12M-12 10L-17 18M-2 10L-7 18M8 10L3 18"),
    sgnd: () => P("M0 0V10M-11 10H11L0 21Z"),
    vcc: (o) => P("M0 0V-12M-11 -12H11") + txt(0, -22, o.text || "+5V", 13, ' font-weight="700"'),
    term: () => P("M0 0H24") + circ(30, 0, 5, ' fill="var(--paper, #fff)"'),
    plug: () => P("M0 0H22M22 -8V8M22 -8H34M22 8H34") + P("M60 0H40M40 -6A8 8 0 0 0 40 6", ""),
  };

  // 端子の位置(回す前の座標)。2 端子の記号は a(0,0) と b(60,0)
  const TWO = { a: [0, 0], b: [60, 0] };
  const PINS = {
    pot: { a: [0, 0], b: [60, 0], w: [30, -24] },
    xfmr: { p1: [0, -18], p2: [0, 18], s1: [60, -18], s2: [60, 18] },
    npn: { b: [0, 0], c: [38, -30], e: [38, 30] },
    pnp: { b: [0, 0], c: [38, -30], e: [38, 30] },
    nmos: { g: [0, 6], d: [38, -30], s: [38, 30] },
    opamp: { m: [0, -12], p: [0, 12], o: [70, 0] },
    swc: { a: [0, 0], b: [60, -12], c: [60, 10] },
    gnd: { a: [0, 0] }, pe: { a: [0, 0] }, chassis: { a: [0, 0] }, sgnd: { a: [0, 0] }, vcc: { a: [0, 0] },
  };
  // 画像にするときの枠(回す前の座標、線幅込みの余白は呼ぶ側で足す)
  const BOX = {
    res: [0, -8, 60, 16], vres: [0, -16, 60, 32], pot: [0, -26, 60, 34], ldr: [0, -28, 60, 36], cap: [0, -13, 60, 26], ecap: [0, -17, 60, 30], vcap: [0, -16, 60, 32],
    ind: [0, -6, 60, 8], xfmr: [0, -21, 60, 42], diode: [0, -11, 60, 22], led: [0, -24, 60, 35], pd: [0, -26, 60, 37], zener: [0, -14, 60, 28],
    npn: [0, -31, 52, 62], pnp: [0, -31, 52, 62], nmos: [0, -31, 50, 62], opamp: [0, -27, 70, 54], lamp: [0, -13, 60, 26], motor: [0, -15, 60, 30], meter: [0, -15, 60, 30],
    buzzer: [0, -14, 60, 22], acsrc: [0, -13, 60, 26], batt: [0, -18, 60, 32], fuse: [0, -6, 60, 12], mccb: [0, -14, 60, 18], swa: [0, -14, 60, 16], swb: [0, -2, 60, 14],
    swc: [0, -14, 60, 26], pba: [0, -24, 60, 26], pbb: [0, -14, 60, 26], coil: [0, -9, 60, 18], coilold: [0, -14, 60, 28], gnd: [-13, 0, 26, 22], pe: [-17, -3, 34, 34],
    chassis: [-18, 0, 32, 19], sgnd: [-12, 0, 24, 22], vcc: [-16, -30, 32, 30], term: [0, -6, 36, 12], plug: [0, -9, 60, 18],
  };
  const SW = 2; // 線幅
  const G = (inner, extra = "") => `<g fill="none" stroke="currentColor" stroke-width="${SW}" stroke-linecap="round" stroke-linejoin="round"${extra}>${inner}</g>`;
  function draw(kind, o = {}) {
    const f = shapes[kind];
    if (!f) throw new Error("unknown symbol " + kind);
    return f(o);
  }
  function place(kind, x, y, rot = 0, o = {}) {
    const t = `translate(${r2(x)} ${r2(y)})` + (rot ? ` rotate(${rot})` : "") + (o.flip ? " scale(1 -1)" : "");
    return G(draw(kind, o), ` transform="${t}"${o.cls ? ` class="${o.cls}"` : ""}${o.attrs || ""}`);
  }
  function pin(kind, x, y, rot, name) {
    const p = (PINS[kind] || TWO)[name];
    if (!p) throw new Error(`${kind} has no pin ${name}`);
    const a = (rot * Math.PI) / 180;
    return [r2(x + p[0] * Math.cos(a) - p[1] * Math.sin(a)), r2(y + p[0] * Math.sin(a) + p[1] * Math.cos(a))];
  }

    { key: "pd", name: "フォトダイオード", code: "D / PD", cat: "semi", desc: "光が当たると電流が流れる。光センサー。", tip: "入ってくる矢印 = 光を受ける" },

    ? [[[L, 95], [L, T], [70, T]], [[130, T], [170, T]], [[230, T], [R, T], [R, 95]], [[R, 155], [R, B], [L, B], [L, 155]]]
    : [[[L, 95], [L, T], [120, T]], [[180, T], [R, T], [R, 95]], [[R, 155], [R, B], [L, B], [L, 155]]];

}

  else if (st.on && st.cut) { cls += " warn"; t = "<b>線が切れていると、スイッチを入れても流れない。</b>電気は + から出て − に戻る「ひとまわりの輪(閉回路)」になっていないと流れない。"; }
  else if (st.on && st.mode === "led" && st.rev) { cls += " warn"; t = "<b>LED は一方通行。</b>回路図の三角の向き(上 → 下)と、電池の + − が逆だと光らない。ランプに切りかえて同じことをしてみよう。"; }
  else t = "<b>スイッチを入れてみよう。</b>部品にマウスを乗せると、もう片方の図の<b>同じ部品</b>が黄色く光る。図面は実物の「つながり」だけを抜き出した絵。";

  $("found").innerHTML = `<b>発見 ${Object.values(found).filter(Boolean).length} / 4</b>` + Object.keys(FOUND_LABEL).map((k) => `<span class="f${found[k] ? " got" : ""}" data-k="${k}">${found[k] ? "✓ " : ""}${FOUND_LABEL[k]}</span>`).join("");

$("sw").addEventListener("click", () => { st.on = !st.on; render(); });

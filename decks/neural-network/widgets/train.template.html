<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>学習のライブデモ</title>
<style>/*CYBER*/
  .wrap { display:flex; height:100%; gap:14px; padding:12px; box-sizing:border-box; }
  .controls { width:200px; flex:none; display:flex; flex-direction:column; gap:8px; }
  .view { position:relative; flex:none; }
  #boundary, #gl { position:absolute; left:0; top:0; border-radius:6px; border:1px solid var(--line); background:#0E1424; }
  #boundary { cursor:crosshair; } #gl { cursor:grab; display:none; }
  .right { flex:1; min-width:0; display:flex; flex-direction:column; gap:10px; }
  .right canvas { width:100%; }
</style>
</head>
<body>
<div class="wrap">
  <div class="controls">
    <label>データ
      <select id="dataset">
        <option value="circle">円(中と外)</option>
        <option value="xor">XOR(市松)</option>
        <option value="gauss">2 つの山</option>
        <option value="spiral">らせん</option>
      </select>
    </label>
    <label>隠れ層の幅(2 層)
      <select id="hidden"><option>2</option><option selected>4</option><option>8</option><option>16</option></select>
    </label>
    <label>学習率
      <select id="lr"><option>0.003</option><option>0.01</option><option selected>0.03</option><option>0.1</option><option>0.3</option><option>1</option></select>
    </label>
    <div class="btns">
      <button id="play" class="primary">▶ 学習開始</button>
      <button id="step">1 エポック</button>
      <button id="reset">↺</button>
      <button id="view3d">3D</button>
    </div>
    <div class="stats">
      <div>エポック<b id="epoch">0</b></div>
      <div>精度<b id="acc">–</b></div>
      <div>訓練損失<b id="loss">–</b></div>
      <div>検証損失<b class="v" id="vloss">–</b></div>
    </div>
    <p class="hint">背景 = 予測、点 = 正解。3D は「シアンである確率」の高さ。</p>
  </div>
  <div class="view"><canvas id="boundary"></canvas><canvas id="gl"></canvas></div>
  <div class="right">
    <canvas id="net" class="plot"></canvas>
    <div class="cap">重み(太さ = 大きさ、シアン = 正、マゼンタ = 負)</div>
    <canvas id="curve" class="plot"></canvas>
    <div class="cap">損失の推移(シアン: 訓練、マゼンタ: 検証)</div>
  </div>
</div>
<script>/*THREE*/</script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const CY = "#00E5FF", MG = "#FF2BD6";
  let seed = 1;
  const rand = () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; };
  const randn = () => { const u = rand() || 1e-9, v = rand(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };

  function genData(kind, n) {
    const pts = [];
    for (let i = 0; i < n; i++) {
      let x, y, l;
      if (kind === "circle") { const r = i % 2 ? 0.25 + rand() * 0.3 : 0.75 + rand() * 0.25; const t = rand() * Math.PI * 2; x = r * Math.cos(t); y = r * Math.sin(t); l = i % 2 ? 1 : 0; }
      else if (kind === "xor") { x = rand() * 2 - 1; y = rand() * 2 - 1; x += x > 0 ? 0.08 : -0.08; y += y > 0 ? 0.08 : -0.08; l = (x > 0) === (y > 0) ? 1 : 0; }
      else if (kind === "gauss") { l = i % 2; const cx = l ? 0.5 : -0.5, cy = l ? 0.5 : -0.5; x = cx + randn() * 0.28; y = cy + randn() * 0.28; }
      else { l = i % 2; const k = Math.floor(i / 2) / (n / 2); const r = 0.15 + k * 0.8, t = k * 2.0 * Math.PI + (l ? Math.PI : 0); x = r * Math.cos(t) + randn() * 0.04; y = r * Math.sin(t) + randn() * 0.04; }
      pts.push({ x: Math.max(-1, Math.min(1, x)), y: Math.max(-1, Math.min(1, y)), l });
    }
    return pts;
  }

  let W = [], B = [], sizes = [];
  function initModel(H) {
    sizes = [2, H, H, 1]; W = []; B = [];
    for (let l = 0; l < sizes.length - 1; l++) {
      const nin = sizes[l], nout = sizes[l + 1], s = Math.sqrt(6 / (nin + nout));
      W.push(Array.from({ length: nout }, () => Array.from({ length: nin }, () => (rand() * 2 - 1) * s)));
      B.push(new Array(nout).fill(0));
    }
  }
  const sig = (z) => 1 / (1 + Math.exp(-z));
  function forward(x, y) {
    const acts = [[x, y]];
    for (let l = 0; l < W.length; l++) {
      const a = acts[l], out = [];
      for (let j = 0; j < W[l].length; j++) { let z = B[l][j]; for (let i = 0; i < a.length; i++) z += W[l][j][i] * a[i]; out.push(l === W.length - 1 ? sig(z) : Math.tanh(z)); }
      acts.push(out);
    }
    return acts;
  }
  function trainEpoch(data, lr, batch = 10) {
    const idx = data.map((_, i) => i);
    for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
    for (let s = 0; s < idx.length; s += batch) {
      const gW = W.map((m) => m.map((r) => r.map(() => 0))), gB = B.map((b) => b.map(() => 0));
      let cnt = 0;
      for (let k = s; k < Math.min(s + batch, idx.length); k++) {
        const p = data[idx[k]], acts = forward(p.x, p.y);
        let delta = [acts[acts.length - 1][0] - p.l];
        for (let l = W.length - 1; l >= 0; l--) {
          const a = acts[l];
          for (let j = 0; j < W[l].length; j++) { gB[l][j] += delta[j]; for (let i = 0; i < a.length; i++) gW[l][j][i] += delta[j] * a[i]; }
          if (l > 0) { const nd = new Array(a.length).fill(0); for (let i = 0; i < a.length; i++) { let sum = 0; for (let j = 0; j < W[l].length; j++) sum += W[l][j][i] * delta[j]; nd[i] = sum * (1 - a[i] * a[i]); } delta = nd; }
        }
        cnt++;
      }
      for (let l = 0; l < W.length; l++) for (let j = 0; j < W[l].length; j++) { B[l][j] -= lr * gB[l][j] / cnt; for (let i = 0; i < W[l][j].length; i++) W[l][j][i] -= lr * gW[l][j][i] / cnt; }
    }
  }
  function evaluate(data) {
    let loss = 0, ok = 0;
    for (const p of data) { const q = Math.min(1 - 1e-7, Math.max(1e-7, forward(p.x, p.y).pop()[0])); loss += -(p.l * Math.log(q) + (1 - p.l) * Math.log(1 - q)); if ((q > 0.5) === (p.l === 1)) ok++; }
    return { loss: loss / data.length, acc: ok / data.length };
  }

  let train = [], test = [], epoch = 0, hist = [], playing = false, mode3d = false;
  function reset() {
    seed = 7;
    const all = genData($("dataset").value, 240);
    train = all.filter((_, i) => i % 5 !== 0); test = all.filter((_, i) => i % 5 === 0);
    initModel(+$("hidden").value);
    epoch = 0; hist = []; playing = false; $("play").textContent = "▶ 学習開始";
    rebuildPoints(); refresh();
  }
  function doEpoch() {
    trainEpoch(train, +$("lr").value); epoch++;
    const tr = evaluate(train), te = evaluate(test);
    hist.push([tr.loss, te.loss]);
    $("epoch").textContent = epoch; $("loss").textContent = tr.loss.toFixed(3); $("vloss").textContent = te.loss.toFixed(3); $("acc").textContent = Math.round(te.acc * 100) + "%";
  }
  function loop() { if (!playing) return; doEpoch(); doEpoch(); doEpoch(); refresh(); requestAnimationFrame(loop); }

  // ---- 2D 描画 ----
  const bc = $("boundary"), nc = $("net"), cc = $("curve"), gl = $("gl"), view = document.querySelector(".view");
  let side = 300;
  function layout() {
    const wrap = document.querySelector(".wrap");
    const h = wrap.clientHeight - 24, wTotal = wrap.clientWidth - 24 - 200 - 28;
    side = Math.max(120, Math.min(h, wTotal * 0.52));
    view.style.width = view.style.height = side + "px";
    bc.width = bc.height = side; bc.style.width = bc.style.height = side + "px";
    gl.style.width = gl.style.height = side + "px"; renderer.setSize(side, side, false); camera.aspect = 1; camera.updateProjectionMatrix();
    const rw = Math.max(120, wTotal - side);
    nc.width = rw; nc.height = Math.floor(h * 0.5) - 14; nc.style.height = nc.height + "px";
    cc.width = rw; cc.height = h - nc.height - 50; cc.style.height = cc.height + "px";
  }
  function drawBoundary() {
    const ctx = bc.getContext("2d"), S = bc.width, G = 48, cell = S / G;
    for (let gy = 0; gy < G; gy++) for (let gx = 0; gx < G; gx++) {
      const x = (gx + 0.5) / G * 2 - 1, y = 1 - (gy + 0.5) / G * 2;
      const p = forward(x, y).pop()[0], a = Math.min(0.75, Math.abs(p - 0.5) * 1.5 + 0.06);
      ctx.fillStyle = p > 0.5 ? `rgba(0,229,255,${a})` : `rgba(255,43,214,${a})`;
      ctx.fillRect(gx * cell, gy * cell, cell + 0.5, cell + 0.5);
    }
    const dot = (p, hollow) => { ctx.beginPath(); ctx.arc((p.x + 1) / 2 * S, (1 - p.y) / 2 * S, 4, 0, Math.PI * 2); ctx.fillStyle = p.l ? CY : MG; ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = hollow ? "#fff" : "#0B0F1A"; ctx.stroke(); };
    train.forEach((p) => dot(p, false)); test.forEach((p) => dot(p, true));
  }
  function drawNet() {
    const ctx = nc.getContext("2d"), Wd = nc.width, Hd = nc.height;
    ctx.clearRect(0, 0, Wd, Hd);
    const xs = sizes.map((_, l) => 30 + (Wd - 60) * l / (sizes.length - 1));
    const pos = sizes.map((n, l) => Array.from({ length: n }, (_, k) => [xs[l], Hd * (k + 1) / (n + 1)]));
    for (let l = 0; l < W.length; l++) for (let j = 0; j < W[l].length; j++) for (let i = 0; i < W[l][j].length; i++) {
      const w = W[l][j][i], m = Math.min(1, Math.abs(w) / 2.5);
      ctx.strokeStyle = w > 0 ? `rgba(0,229,255,${0.12 + m * 0.88})` : `rgba(255,43,214,${0.12 + m * 0.88})`; ctx.lineWidth = 0.5 + m * 4;
      ctx.beginPath(); ctx.moveTo(pos[l][i][0], pos[l][i][1]); ctx.lineTo(pos[l + 1][j][0], pos[l + 1][j][1]); ctx.stroke();
    }
    pos.forEach((layer, l) => layer.forEach(([x, y]) => { ctx.beginPath(); ctx.arc(x, y, 8, 0, Math.PI * 2); ctx.fillStyle = l === 0 ? "#B6FF3C" : l === pos.length - 1 ? MG : CY; ctx.fill(); ctx.strokeStyle = "#0B0F1A"; ctx.lineWidth = 2; ctx.stroke(); }));
  }
  function drawCurve() {
    const ctx = cc.getContext("2d"), Wd = cc.width, Hd = cc.height, L = 34, Bm = 18;
    ctx.clearRect(0, 0, Wd, Hd);
    ctx.strokeStyle = "rgba(0,229,255,0.25)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(L, 8); ctx.lineTo(L, Hd - Bm); ctx.lineTo(Wd - 8, Hd - Bm); ctx.stroke();
    ctx.fillStyle = "#7C8AA5"; ctx.font = "10px Meiryo, sans-serif"; ctx.textAlign = "right";
    if (!hist.length) { ctx.textAlign = "center"; ctx.fillText("「▶ 学習開始」で記録が始まる", Wd / 2, Hd / 2); return; }
    const maxL = Math.max(0.2, ...hist.map((h) => Math.max(h[0], h[1])));
    ctx.fillText(maxL.toFixed(2), L - 4, 12); ctx.fillText("0", L - 4, Hd - Bm);
    ctx.textAlign = "center"; ctx.fillText(`エポック ${epoch}`, Wd / 2, Hd - 4);
    const px = (i) => L + (Wd - L - 8) * i / Math.max(1, hist.length - 1), py = (v) => Hd - Bm - (Hd - Bm - 8) * v / maxL;
    [[0, CY], [1, MG]].forEach(([k, col]) => { ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.beginPath(); hist.forEach((h, i) => (i ? ctx.lineTo(px(i), py(h[k])) : ctx.moveTo(px(i), py(h[k])))); ctx.stroke(); });
  }

  // ---- 3D 表示(確率の曲面)----
  const renderer = new THREE.WebGLRenderer({ canvas: gl, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 50);
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const dl = new THREE.DirectionalLight(0xffffff, 0.8); dl.position.set(2, 5, 3); scene.add(dl);
  const G3 = 40, HZ = 1.4;
  const sgeo = new THREE.PlaneGeometry(2, 2, G3, G3); sgeo.rotateX(-Math.PI / 2);
  sgeo.setAttribute("color", new THREE.Float32BufferAttribute(new Float32Array(sgeo.attributes.position.count * 3), 3));
  scene.add(new THREE.Mesh(sgeo, new THREE.MeshStandardMaterial({ vertexColors: true, side: THREE.DoubleSide, roughness: 0.8, transparent: true, opacity: 0.9 })));
  const wire = new THREE.LineSegments(new THREE.WireframeGeometry(new THREE.PlaneGeometry(2, 2, 12, 12).rotateX(-Math.PI / 2)), new THREE.LineBasicMaterial({ color: 0x00E5FF, transparent: true, opacity: 0.25 }));
  scene.add(wire);
  let ptsObj = null;
  function rebuildPoints() {
    if (ptsObj) scene.remove(ptsObj);
    const all = train.concat(test), p = new Float32Array(all.length * 3), c = new Float32Array(all.length * 3);
    all.forEach((d, i) => { p[i * 3] = d.x; p[i * 3 + 1] = d.l * HZ + 0.04; p[i * 3 + 2] = -d.y; const col = d.l ? [0, 0.9, 1] : [1, 0.17, 0.84]; c[i * 3] = col[0]; c[i * 3 + 1] = col[1]; c[i * 3 + 2] = col[2]; });
    const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(p, 3)); g.setAttribute("color", new THREE.BufferAttribute(c, 3));
    ptsObj = new THREE.Points(g, new THREE.PointsMaterial({ size: 0.05, vertexColors: true })); scene.add(ptsObj);
  }
  function updateSurface() {
    const pos = sgeo.attributes.position, col = sgeo.attributes.color, wp = wire.geometry.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const p = forward(pos.getX(i), -pos.getZ(i)).pop()[0];
      pos.setY(i, p * HZ);
      const t = p; col.setXYZ(i, t * 0 + (1 - t) * 1, t * 0.9 + (1 - t) * 0.17, t * 1 + (1 - t) * 0.84);
    }
    for (let i = 0; i < wp.count; i++) wp.setY(i, forward(wp.getX(i), -wp.getZ(i)).pop()[0] * HZ + 0.01);
    pos.needsUpdate = true; col.needsUpdate = true; wp.needsUpdate = true; sgeo.computeVertexNormals();
  }
  let theta = 0.6, phi = 1.0, dist = 3.6, drag = null, idle = 0;
  function placeCamera() { camera.position.set(dist * Math.sin(phi) * Math.cos(theta), dist * Math.cos(phi), dist * Math.sin(phi) * Math.sin(theta)); camera.lookAt(0, 0.5, 0); }
  gl.addEventListener("pointerdown", (e) => { drag = [e.clientX, e.clientY]; gl.setPointerCapture(e.pointerId); });
  gl.addEventListener("pointermove", (e) => { if (!drag) return; theta += (e.clientX - drag[0]) * 0.008; phi = Math.max(0.3, Math.min(1.45, phi - (e.clientY - drag[1]) * 0.006)); drag = [e.clientX, e.clientY]; idle = 0; });
  gl.addEventListener("pointerup", () => (drag = null));
  let last = performance.now();
  function animate(now) {
    requestAnimationFrame(animate);
    if (!mode3d) return;
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (!drag) { idle += dt; if (idle > 2) theta += dt * 0.12; }
    placeCamera(); renderer.render(scene, camera);
  }

  function refresh() { drawNet(); drawCurve(); if (mode3d) updateSurface(); else drawBoundary(); }

  $("play").onclick = () => { playing = !playing; $("play").textContent = playing ? "⏸ 一時停止" : "▶ 学習開始"; if (playing) requestAnimationFrame(loop); };
  $("step").onclick = () => { playing = false; $("play").textContent = "▶ 学習開始"; doEpoch(); refresh(); };
  $("reset").onclick = reset; $("dataset").onchange = reset; $("hidden").onchange = reset;
  $("view3d").onclick = () => { mode3d = !mode3d; $("view3d").textContent = mode3d ? "2D" : "3D"; bc.style.display = mode3d ? "none" : "block"; gl.style.display = mode3d ? "block" : "none"; last = performance.now(); refresh(); };
  bc.onclick = (e) => { const r = bc.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * 2 - 1, y = 1 - (e.clientY - r.top) / r.height * 2; train.push({ x, y, l: e.shiftKey ? 0 : 1 }); rebuildPoints(); refresh(); };
  new ResizeObserver(() => { layout(); refresh(); }).observe(document.body);
  layout(); reset(); placeCamera(); animate(performance.now());
})();
</script>
</body>
</html>

<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>逆拡散と CFG</title>
<style>/* sd-lora のウィジェット共通（暗室テーマ）。1em = iframe の幅 / --cols（各ウィジェットが決める）。

:root {
  --bg: #15110F; --card: #1C1714; --raise: #26201C; --line: #3B332C; --ink: #EFE7DB; --sub: #A89E91; --mute: #776D63;
  --red: #FF5A47; --amber: #F3B23E; --teal: #45C4B0; --blue: #7FA2FF; --violet: #C08BFF;
  --red-soft: rgba(255, 90, 71, .15); --amber-soft: rgba(243, 178, 62, .15); --teal-soft: rgba(69, 196, 176, .15); --violet-soft: rgba(192, 139, 255, .15);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: transparent; }
body { color: var(--ink); font: 400 calc(100vw / var(--cols, 46)) / 1.4 "Yu Gothic UI", "Meiryo UI", "Meiryo", sans-serif; overflow: hidden; }
.frame { height: 100%; display: flex; flex-direction: column; gap: .55em; padding: .7em .9em .75em; background: var(--card); border: 1px solid var(--line); border-radius: .7em; }
header { display: flex; align-items: center; gap: .6em; min-height: 1.5em; }
.tag { font-size: .78em; font-weight: 700; letter-spacing: .08em; color: var(--red); white-space: nowrap; }
.tag::before { content: ""; display: inline-block; width: .55em; height: .55em; margin-right: .45em; border-radius: 50%; background: currentColor; box-shadow: 0 0 .5em currentColor; vertical-align: .05em; }
.chip { margin-left: auto; font-size: .72em; padding: .1em .7em; border-radius: 999px; background: var(--raise); color: var(--sub); white-space: nowrap; }
.num, output { font-family: Consolas, "Cascadia Mono", monospace; font-variant-numeric: tabular-nums; }
button { font: inherit; color: var(--ink); cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.btn { border: 1px solid var(--line); background: var(--raise); border-radius: 999px; padding: .2em .85em; font-size: .85em; font-weight: 700; white-space: nowrap; }
.btn:hover { border-color: var(--amber); color: var(--amber); }
.btn.primary { background: var(--amber); border-color: var(--amber); color: #261A06; }
.btn.primary:hover { filter: brightness(1.08); color: #261A06; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; flex: none; }
.seg button { border: 0; background: transparent; padding: .2em .75em; font-size: .82em; color: var(--sub); white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--raise); color: var(--ink); font-weight: 700; box-shadow: inset 0 -2px 0 var(--amber); }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: .45em .9em; }
label { display: inline-flex; align-items: center; gap: .45em; font-size: .85em; color: var(--sub); white-space: nowrap; }
label b { color: var(--ink); }
input[type=range] { width: 7.5em; accent-color: var(--amber); margin: 0; }
output { color: var(--ink); min-width: 2.4em; display: inline-block; }
.tile { background: var(--raise); border-radius: .45em; padding: .3em .6em .35em; min-width: 0; }
.tile .k { font-size: .72em; color: var(--sub); white-space: nowrap; }
.tile .v { font-size: 1.25em; font-weight: 700; line-height: 1.2; white-space: nowrap; }
.hint { font-size: .8em; color: var(--sub); line-height: 1.45; }
.hint b { color: var(--ink); }
.red { color: var(--red); } .amber { color: var(--amber); } .teal { color: var(--teal); } .blue { color: var(--blue); } .violet { color: var(--violet); } .sub { color: var(--sub); }
canvas { display: block; }
.m { font-family: "Cambria Math", Cambria, "Times New Roman", serif; font-size: 1.08em; }

:root { --cols: 48; }
.main { flex: 1; min-height: 0; display: flex; gap: .75em; }
#cv { height: 100%; aspect-ratio: 1; border-radius: .4em; background: #0F0C0A; box-shadow: 0 0 0 1px var(--line); flex: none; }
.side { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: .42em; }
.steprow { display: flex; justify-content: space-between; font-size: .8em; color: var(--sub); }
.steprow b { color: var(--ink); }

.tiles .v { font-size: 1.1em; }

.hint { flex: none; min-height: 4.35em; }
#sweep { flex: 1; min-height: 4em; width: 100%; }
</style></head><body><div class="frame">
<header><span class="tag">REVERSE · ノイズから生成し、CFG で導く</span><span class="chip">2 次元の玩具モデル：スコアは式で厳密に計算</span></header>
<div class="main"><canvas id="cv" aria-label="2 次元の点の分布"></canvas><div class="side">
  <div class="steprow"><span>ステップ <b class="num" id="st"></b></span><span>t = <b class="num" id="tt"></b></span></div>
  <div class="prog"><i id="pg"></i></div>
  <div class="tiles">
    <div class="tile"><div class="k" id="k1">条件どおり</div><div class="v num" id="m1"></div></div>
    <div class="tile"><div class="k">覆った区画</div><div class="v num" id="m2"></div></div>
    <div class="tile"><div class="k">データ外</div><div class="v num" id="m3"></div></div>
  </div>
  <div class="formula"><span class="m">ε̃ = ε<sub>θ</sub>(z<sub>t</sub>, ∅) + <b class="amber">w</b>·( ε<sub>θ</sub>(z<sub>t</sub>, <span class="teal">c</span>) − ε<sub>θ</sub>(z<sub>t</sub>, ∅) )</span><br><span class="sub">1 手ごとに条件あり・なしの 2 回予測し、差を w 倍して足す</span></div>
  <div class="hint" id="hint"></div>
  <canvas id="sweep" aria-label="w を変えたときの多様性と条件どおりの割合"></canvas>
  <div class="legend"><span><i class="dot" style="background:var(--teal)"></i>「猫」の分布（上）</span><span><i class="dot" style="background:var(--violet)"></i>「犬」の分布（下）</span><span><i class="dot" style="background:var(--amber)"></i>粒の軌跡</span><span><i class="dot" style="background:var(--red)"></i>データ外</span></div>
</div></div>
<div class="controls">
  <div class="seg" id="cond"><button data-v="0" class="on" aria-pressed="true">「猫」</button><button data-v="1" aria-pressed="false">「犬」</button><button data-v="u" aria-pressed="false">空（無条件）</button></div>
  <label>CFG <b>w</b><input type="range" id="w" min="0" max="15" step="0.5" value="7.5" aria-label="CFG スケール"><output id="wv"></output></label>
  <label>手数 <b>N</b><input type="range" id="n" min="2" max="50" value="20" aria-label="サンプリングの手数"><output id="nv"></output></label>
</div>
<div class="controls">
  <div class="seg" id="eta"><button data-v="0" class="on" aria-pressed="true">DDIM（決定的）</button><button data-v="1" aria-pressed="false">確率的（η = 1）</button></div>
  <button class="btn primary" id="play">▶ ノイズから生成</button>
  <button class="btn" id="reseed">別の乱数で</button>
</div>
</div>
<script>"use strict";
// sd-lora のウィジェット共通: 乱数、SD 1.5 と cosine のノイズスケジュール、canvas の解像度合わせ、状態の保存と復元
const $ = (id) => document.getElementById(id);
function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function gauss(r) { const u = Math.max(r(), 1e-12), v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
const T = 1000;
// SD 1.5: scaled linear（β の平方根を 0.00085→0.012 で線形に並べて 2 乗）
const ABAR_SD = (() => { const a = []; let p = 1; const b0 = Math.sqrt(0.00085), b1 = Math.sqrt(0.012); for (let i = 0; i < T; i++) { const b = (b0 + (b1 - b0) * i / (T - 1)) ** 2; p *= 1 - b; a.push(p); } return a; })();
// cosine（Nichol & Dhariwal 2021、s = 0.008、β ≤ 0.999）
const ABAR_COS = (() => { const f = (t) => Math.cos((t / T + 0.008) / 1.008 * Math.PI / 2) ** 2; const a = []; let p = 1; for (let i = 0; i < T; i++) { p *= 1 - Math.min(1 - f(i + 1) / f(i), 0.999); a.push(p); } return a; })();
function fitCanvas(c) {
  const r = c.getBoundingClientRect(), d = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(r.width * d)), h = Math.max(1, Math.round(r.height * d));
  if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
  const g = c.getContext("2d"); g.setTransform(d, 0, 0, d, 0, 0);
  return { g, w: r.width, h: r.height };
}
const fmt = (v, n = 0) => v.toLocaleString("en-US", { minimumFractionDigits: n, maximumFractionDigits: n });
function segment(el, onPick) {
  el.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => { setSeg(el, b.dataset.v); onPick(b.dataset.v); }));
}
function setSeg(el, v) { el.querySelectorAll("button").forEach((b) => { const on = b.dataset.v === String(v); b.classList.toggle("on", on); b.setAttribute("aria-pressed", String(on)); }); }
// アプリに状態を預け、読み直したときに戻す（deck-studio:widget-state / widget-restore）
let publishing = false;
function publish(state) { if (publishing && parent !== window) parent.postMessage({ type: "deck-studio:widget-state", state }, "*"); }
function onRestore(fn) {
  window.addEventListener("message", (e) => {
    if (e.source !== parent || e.data?.type !== "deck-studio:widget-restore" || !e.data.state) return;
    const p = publishing; publishing = false; fn(e.data.state); publishing = p;
  });
}
function ready() { publishing = true; if (parent !== window) parent.postMessage({ type: "deck-studio:widget-ready" }, "*"); }

// データ: 2 つの三日月（各 7 個のガウス分布）。上 = 「猫」、下 = 「犬」
const S = 1.25, SIG = 0.13, COMPS = [];
for (let i = 0; i < 7; i++) {
  const th = Math.PI * i / 6;
  COMPS.push({ m: [S * (Math.cos(th) - 0.5), S * (Math.sin(th) - 0.25)], c: 0 });
  COMPS.push({ m: [S * (0.5 - Math.cos(th)), S * (0.25 - Math.sin(th))], c: 1 });
}
const P = 500, TRAILS = 18, RANGE = 3;
let cond = "0", w = 7.5, n = 20, eta = 0, seed = 1, hist = [], shown = 0, timer = 0;
// ノイズを足した混合ガウスのスコアから、最適な ε の予測を出す（ε̂ = −√(1−ᾱ)∇log p_t）
function epsHat(x, y, a, cls) {
  const sa = Math.sqrt(a), v = a * SIG * SIG + 1 - a; let mx = -Infinity; const ls = [];
  for (const k of COMPS) {
    if (cls !== null && k.c !== cls) { ls.push(-Infinity); continue; }
    const dx = x - sa * k.m[0], dy = y - sa * k.m[1], l = -(dx * dx + dy * dy) / (2 * v); ls.push(l); if (l > mx) mx = l;
  }
  let sx = 0, sy = 0, den = 0;
  COMPS.forEach((k, i) => { if (ls[i] === -Infinity) return; const r = Math.exp(ls[i] - mx); den += r; sx += r * (sa * k.m[0] - x) / v; sy += r * (sa * k.m[1] - y) / v; });
  const s = Math.sqrt(1 - a); return [-s * sx / den, -s * sy / den];
}
// DDIM（η = 0 なら決定的）で z_T から z_0 まで進める。keep なら途中の点も残す
function run(wv, count, keep) {
  const r = rng(seed * 7919 + 13), pts = [];
  for (let i = 0; i < count; i++) pts.push([gauss(r), gauss(r)]);
  const ts = []; for (let i = 0; i < n; i++) ts.push(Math.round(999 - 999 * i / n));
  const out = [{ t: 999, p: keep ? pts.map((q) => q.slice()) : null }];
  const c = cond === "u" ? null : +cond, w = wv;
  for (let j = 0; j < n; j++) {
    const a = ABAR_SD[ts[j]], an = j + 1 < n ? ABAR_SD[ts[j + 1]] : 1;
    const sig = eta * Math.sqrt((1 - an) / (1 - a)) * Math.sqrt(Math.max(0, 1 - a / an)), cc = Math.sqrt(Math.max(0, 1 - an - sig * sig));
    for (const q of pts) {
      let e = epsHat(q[0], q[1], a, null);
      if (c !== null) { const ec = epsHat(q[0], q[1], a, c); e = [e[0] + w * (ec[0] - e[0]), e[1] + w * (ec[1] - e[1])]; }
      const x0 = [(q[0] - Math.sqrt(1 - a) * e[0]) / Math.sqrt(a), (q[1] - Math.sqrt(1 - a) * e[1]) / Math.sqrt(a)];
      q[0] = Math.sqrt(an) * x0[0] + cc * e[0] + sig * gauss(r);
      q[1] = Math.sqrt(an) * x0[1] + cc * e[1] + sig * gauss(r);
    }
    out.push({ t: j + 1 < n ? ts[j + 1] : 0, p: keep || j === n - 1 ? pts.map((q) => q.slice()) : null });
  }
  return out;
}
function simulate() { hist = run(w, P, true); }
// w を 0〜15 で変えたときの「覆った区画」と「条件どおり」（同じ乱数・手数。点は 200 個で計算）
const SWEEP_W = [0, 0.5, 1, 1.5, 2, 3, 4, 5, 6, 7.5, 9, 11, 13, 15];
let sweepKey = "", sweepData = [];
function sweep() {
  const key = `${cond}|${n}|${eta}|${seed}`;
  if (key === sweepKey) return;
  sweepKey = key;
  sweepData = cond === "u" ? [] : SWEEP_W.map((wv) => { const pts = run(wv, 200, false).at(-1).p, m = metrics(pts); return { w: wv, cover: m.cover, of: m.of, hit: m.cls[+cond] / pts.length }; });
}
function drawSweep() {
  const { g, w: W, h: H } = fitCanvas($("sweep")), fs = parseFloat(getComputedStyle(document.body).fontSize);
  g.clearRect(0, 0, W, H); g.font = `${fs * .68}px "Yu Gothic UI", sans-serif`;
  g.fillStyle = "#26201C"; g.beginPath(); g.roundRect(0, 0, W, H, fs * .45); g.fill();
  if (!sweepData.length) { g.fillStyle = "#776D63"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText("無条件では w を使わない", W / 2, H / 2); return; }
  const L = fs * .8, R = fs * .8, Tp = fs * 1.35, B = fs * 1.15, X = (v) => L + (W - L - R) * v / 15, Y = (v) => Tp + (H - Tp - B) * (1 - v);
  g.textBaseline = "middle"; g.textAlign = "left"; g.fillStyle = "#A89E91"; g.fillText("w を変えると（同じ乱数で計算）", L, fs * .62);
  g.textAlign = "right"; g.fillStyle = "#45C4B0"; g.fillText("— 条件どおり", W - R - fs * 5.2, fs * .62); g.fillStyle = "#F3B23E"; g.fillText("— 覆った区画", W - R, fs * .62);
  g.strokeStyle = "#3B332C"; g.lineWidth = 1; g.beginPath(); g.moveTo(L, Y(0)); g.lineTo(W - R, Y(0)); g.stroke();
  g.fillStyle = "#776D63"; g.textAlign = "center"; g.textBaseline = "top";
  for (const v of [0, 1, 7.5, 15]) g.fillText(v === 7.5 ? "7.5" : String(v), X(v), Y(0) + 2);
  const line = (f, col) => { g.strokeStyle = col; g.lineWidth = 1.8; g.beginPath(); sweepData.forEach((d, i) => (i ? g.lineTo(X(d.w), Y(f(d))) : g.moveTo(X(d.w), Y(f(d))))); g.stroke(); };
  line((d) => d.hit, "#45C4B0"); line((d) => d.cover / d.of, "#F3B23E");
  g.strokeStyle = "rgba(239,231,219,.55)"; g.setLineDash([3, 3]); g.beginPath(); g.moveTo(X(w), Tp - 2); g.lineTo(X(w), Y(0)); g.stroke(); g.setLineDash([]);
}
function nearest(q) { let best = Infinity, bk = 0; COMPS.forEach((k, i) => { const d = Math.hypot(q[0] - k.m[0], q[1] - k.m[1]); if (d < best) { best = d; bk = i; } }); return [bk, best]; }
function metrics(pts) {
  const hit = new Array(COMPS.length).fill(0); let off = 0, cls = [0, 0];
  for (const q of pts) { const [k, d] = nearest(q); if (d > 0.4) off++; else { hit[k]++; cls[COMPS[k].c]++; } }
  const want = cond === "u" ? null : +cond;
  const pool = COMPS.map((k, i) => i).filter((i) => want === null || COMPS[i].c === want);
  return { cls, off, cover: pool.filter((i) => hit[i] >= pts.length * 0.02).length, of: pool.length };
}
function draw() {
  const { g, w: W, h: H } = fitCanvas($("cv")), X = (x) => (x + RANGE) / (2 * RANGE) * W, Y = (y) => (RANGE - y) / (2 * RANGE) * H, sc = W / (2 * RANGE);
  g.clearRect(0, 0, W, H);
  g.strokeStyle = "rgba(59,51,44,.55)"; g.lineWidth = 1;
  for (let v = -RANGE + 1; v < RANGE; v++) { g.beginPath(); g.moveTo(X(v), 0); g.lineTo(X(v), H); g.moveTo(0, Y(v)); g.lineTo(W, Y(v)); g.stroke(); }
  const want = cond === "u" ? null : +cond;
  for (const k of COMPS) {
    const col = k.c === 0 ? "69,196,176" : "192,139,255", on = want === null || want === k.c;
    const gr = g.createRadialGradient(X(k.m[0]), Y(k.m[1]), 0, X(k.m[0]), Y(k.m[1]), SIG * 2.6 * sc);
    gr.addColorStop(0, `rgba(${col},${on ? .42 : .16})`); gr.addColorStop(1, `rgba(${col},0)`);
    g.fillStyle = gr; g.beginPath(); g.arc(X(k.m[0]), Y(k.m[1]), SIG * 2.6 * sc, 0, 7); g.fill();
  }
  const cur = hist[shown], done = shown === hist.length - 1;
  g.strokeStyle = "rgba(243,178,62,.55)"; g.lineWidth = 1.1;
  for (let i = 0; i < TRAILS; i++) { g.beginPath(); for (let j = 0; j <= shown; j++) { const q = hist[j].p[i]; j ? g.lineTo(X(q[0]), Y(q[1])) : g.moveTo(X(q[0]), Y(q[1])); } g.stroke(); }
  for (let i = 0; i < P; i++) {
    const q = cur.p[i]; let col = "rgba(239,231,219,.75)";
    if (done) { const [k, d] = nearest(q); col = d > 0.4 ? "#FF5A47" : COMPS[k].c === 0 ? "#7FE3D2" : "#D9B8FF"; }
    g.fillStyle = col; g.fillRect(X(q[0]) - 1.3, Y(q[1]) - 1.3, 2.6, 2.6);
  }
  for (let i = 0; i < TRAILS; i++) { const q = cur.p[i]; g.fillStyle = "#F3B23E"; g.beginPath(); g.arc(X(q[0]), Y(q[1]), 2.6, 0, 7); g.fill(); }
  g.fillStyle = "rgba(168,158,145,.9)"; g.font = `${parseFloat(getComputedStyle(document.body).fontSize) * .7}px "Yu Gothic UI", sans-serif`; g.textBaseline = "top";
  g.fillText(shown === 0 ? "z_T：ただの正規乱数" : done ? "z_0：生成結果" : "途中の z_t", 6, 5);
}
function panel() {
  const cur = hist[shown], done = shown === hist.length - 1;
  $("st").textContent = `${shown} / ${n}`; $("tt").textContent = cur.t; $("pg").style.width = `${shown / n * 100}%`;
  $("wv").textContent = w.toFixed(1); $("nv").textContent = n;
  $("k1").textContent = cond === "u" ? "猫 : 犬" : "条件どおり";
  if (!done) { $("m1").textContent = $("m2").textContent = $("m3").textContent = "…"; $("hint").innerHTML = "<b>各手で <span class=\"m\">ε</span> を予測 → <span class=\"m\">x̂<sub>0</sub></span> を推定 → 少しノイズの少ない <span class=\"m\">z<sub>t−Δ</sub></span> へ。</b>点の雲が少しずつ分布の形に縮む"; return; }
  const m = metrics(cur.p), tot = m.cls[0] + m.cls[1] || 1;
  $("m1").textContent = cond === "u" ? `${Math.round(m.cls[0] / tot * 100)} : ${Math.round(m.cls[1] / tot * 100)}` : `${Math.round(m.cls[+cond] / P * 100)}%`;
  $("m2").textContent = `${m.cover} / ${m.of}`; $("m3").textContent = `${Math.round(m.off / P * 100)}%`;
  let h;
  if (cond === "u") h = "<b>条件なし：猫と犬が半々で出る。</b>CFG にはこの無条件の予測も要るので、SD は学習中 10% の確率で文章を空にして両方を学んだ";
  else if (w === 0) h = "<b>w = 0 は条件を無視</b>（無条件と同じ）。相手のクラスも同じだけ出る";
  else if (w < 1) h = "<b>弱い誘導：</b>相手のクラスがまだ混じる";
  else if (w === 1) h = "<b>w = 1：条件付きの分布をそのまま再現。</b>三日月の全区画を覆う";
  else if (w <= 3) h = "<b>やや強い誘導：</b>条件らしさが増す。相手の分布に近い先端から出にくくなる";
  else h = "<b>強い誘導：条件には忠実だが、出る場所が偏る（多様性の低下）。</b>実際の画像では、上げすぎると色の飽和や硬いコントラストとして出やすい。SD 1.5 の既定は 7.5";
  if (n <= 4) h += "<br><b class=\"red\">手数が少ない：</b>1 手の近似が粗く、データから外れる点が増える。DPM-Solver++ などは少ない手数でも外れにくいよう工夫した解き方";
  $("hint").innerHTML = h;
}
function show(i) { shown = i; draw(); panel(); drawSweep(); }
function recompute() { clearTimeout(timer); simulate(); sweep(); show(hist.length - 1); publish({ cond, w, n, eta, seed }); }
function play() {
  clearTimeout(timer); simulate(); sweep(); let i = 0; const dt = Math.max(45, 2600 / n);
  const tick = () => { show(i); if (i < hist.length - 1) { i++; timer = setTimeout(tick, i === 1 ? 500 : dt); } };
  tick();
}
segment($("cond"), (v) => { cond = v; recompute(); });
segment($("eta"), (v) => { eta = +v; recompute(); });
$("w").addEventListener("input", (e) => { w = +e.target.value; recompute(); });
$("n").addEventListener("input", (e) => { n = +e.target.value; recompute(); });
$("play").addEventListener("click", play);
$("reseed").addEventListener("click", () => { seed++; play(); });
onRestore((s) => {
  if (["0", "1", "u"].includes(s.cond)) { cond = s.cond; setSeg($("cond"), cond); }
  if (Number.isFinite(s.w)) w = Math.max(0, Math.min(15, s.w)); if (Number.isFinite(s.n)) n = Math.max(2, Math.min(50, s.n | 0));
  if (s.eta === 0 || s.eta === 1) { eta = s.eta; setSeg($("eta"), eta); } if (Number.isFinite(s.seed)) seed = s.seed | 0;
  $("w").value = w; $("n").value = n; recompute();
});
new ResizeObserver(() => { if (hist.length) { draw(); drawSweep(); } }).observe(document.body);
recompute(); ready();
</script></body></html>

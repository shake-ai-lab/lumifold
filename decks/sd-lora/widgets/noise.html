<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>前向き過程：ノイズを足す</title>
<style>/* sd-lora のウィジェット共通（暗室テーマ）。1em = iframe の幅 / --cols（各ウィジェットが決める）。
   赤 = ノイズ・拡散、琥珀 = 信号・LoRA、青緑 = 文字の条件、青 = 潜在、紫 = 2 つ目のクラス */
:root {
  --bg: #15110F; --card: #1C1714; --raise: #26201C; --line: #3B332C; --ink: #EFE7DB; --sub: #A89E91; --mute: #776D63;
  --red: #FF5A47; --amber: #F3B23E; --teal: #45C4B0; --blue: #7FA2FF; --violet: #C08BFF;
  --red-soft: rgba(255, 90, 71, .15); --amber-soft: rgba(243, 178, 62, .15); --teal-soft: rgba(69, 196, 176, .15); --violet-soft: rgba(192, 139, 255, .15);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: transparent; }
body { color: var(--ink); font: 400 calc(100vw / var(--cols, 46)) / 1.4 "Yu Gothic UI", "Meiryo UI", "Meiryo", sans-serif; overflow: hidden; }
.frame { height: 100%; display: flex; flex-direction: column; gap: .55em; padding: .7em .9em .75em; background: var(--card); border: 1px solid var(--line); border-radius: .7em; }
header { display: flex; align-items: center; gap: .6em; min-height: 1.5em; }
.tag { font-size: .78em; font-weight: 700; letter-spacing: .08em; color: var(--red); white-space: nowrap; }
.tag::before { content: ""; display: inline-block; width: .55em; height: .55em; margin-right: .45em; border-radius: 50%; background: currentColor; box-shadow: 0 0 .5em currentColor; vertical-align: .05em; }
.chip { margin-left: auto; font-size: .72em; padding: .1em .7em; border-radius: 999px; background: var(--raise); color: var(--sub); white-space: nowrap; }
.num, output { font-family: Consolas, "Cascadia Mono", monospace; font-variant-numeric: tabular-nums; }
button { font: inherit; color: var(--ink); cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.btn { border: 1px solid var(--line); background: var(--raise); border-radius: 999px; padding: .2em .85em; font-size: .85em; font-weight: 700; white-space: nowrap; }
.btn:hover { border-color: var(--amber); color: var(--amber); }
.btn.primary { background: var(--amber); border-color: var(--amber); color: #261A06; }
.btn.primary:hover { filter: brightness(1.08); color: #261A06; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; flex: none; }
.seg button { border: 0; background: transparent; padding: .2em .75em; font-size: .82em; color: var(--sub); white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--raise); color: var(--ink); font-weight: 700; box-shadow: inset 0 -2px 0 var(--amber); }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: .45em .9em; }
label { display: inline-flex; align-items: center; gap: .45em; font-size: .85em; color: var(--sub); white-space: nowrap; }
label b { color: var(--ink); }
input[type=range] { width: 7.5em; accent-color: var(--amber); margin: 0; }
output { color: var(--ink); min-width: 2.4em; display: inline-block; }
.tile { background: var(--raise); border-radius: .45em; padding: .3em .6em .35em; min-width: 0; }
.tile .k { font-size: .72em; color: var(--sub); white-space: nowrap; }
.tile .v { font-size: 1.25em; font-weight: 700; line-height: 1.2; white-space: nowrap; }
.hint { font-size: .8em; color: var(--sub); line-height: 1.45; }
.hint b { color: var(--ink); }
.red { color: var(--red); } .amber { color: var(--amber); } .teal { color: var(--teal); } .blue { color: var(--blue); } .violet { color: var(--violet); } .sub { color: var(--sub); }
canvas { display: block; }
.m { font-family: "Cambria Math", Cambria, "Times New Roman", serif; font-size: 1.08em; }

:root { --cols: 46; }
.row { display: flex; align-items: flex-start; justify-content: center; gap: .45em; }
.pic { display: flex; flex-direction: column; align-items: center; gap: .25em; }
.pic canvas { width: 9em; height: 9em; border-radius: .3em; box-shadow: 0 0 0 1px var(--line); background: #000; }
.pic.big canvas { width: 11.2em; height: 11.2em; box-shadow: 0 0 0 1px var(--amber), 0 0 1.2em rgba(243, 178, 62, .18); }
.op { font-size: 1.7em; color: var(--sub); align-self: center; margin-top: -.7em; font-weight: 300; }
.cap { font-size: .76em; color: var(--sub); white-space: nowrap; }
.bottom { flex: 1; min-height: 0; display: flex; gap: .6em; }
#chart { flex: 1; min-width: 0; height: 100%; }
.tiles { display: grid; grid-template-rows: repeat(3, 1fr); gap: .3em; width: 9.6em; }
.tiles .v { font-size: 1.05em; }
.hint { min-height: 2.9em; }
</style></head><body><div class="frame">
<header><span class="tag">FORWARD · ノイズを足す（学習で使う過程）</span><span class="chip">SD 1.5 と同じ式・係数</span></header>
<div class="row">
  <div class="pic"><canvas id="sig" aria-label="信号の成分"></canvas><div class="cap"><span class="amber">信号</span> <span class="m">√ᾱ<sub>t</sub>·x<sub>0</sub></span></div></div>
  <div class="op">+</div>
  <div class="pic"><canvas id="noi" aria-label="ノイズの成分"></canvas><div class="cap"><span class="red">ノイズ</span> <span class="m">√(1−ᾱ<sub>t</sub>)·ε</span></div></div>
  <div class="op">=</div>
  <div class="pic big"><canvas id="xt" aria-label="ノイズを足した画像"></canvas><div class="cap"><span class="m">x<sub>t</sub></span>（UNet に渡す入力）</div></div>
</div>
<div class="bottom"><canvas id="chart" aria-label="係数のグラフ"></canvas><div class="tiles">
  <div class="tile"><div class="k">信号の係数 <span class="m">√ᾱ<sub>t</sub></span></div><div class="v amber num" id="vs"></div></div>
  <div class="tile"><div class="k">ノイズの係数 <span class="m">√(1−ᾱ<sub>t</sub>)</span></div><div class="v red num" id="vn"></div></div>
  <div class="tile"><div class="k">SNR = <span class="m">ᾱ<sub>t</sub> / (1−ᾱ<sub>t</sub>)</span></div><div class="v num" id="vr"></div></div>
</div></div>
<div class="hint" id="hint"></div>
<div class="controls">
  <label>時刻 <b>t</b><input type="range" id="t" min="0" max="999" value="400" aria-label="時刻 t"><output id="tv"></output></label>
  <div class="seg" id="sched"><button data-v="sd" class="on" aria-pressed="true">SD 1.5（scaled linear）</button><button data-v="cos" aria-pressed="false">cosine</button></div>
  <button class="btn primary" id="play">▶ 0 → 999</button>
</div>
</div>
<script>"use strict";
// sd-lora のウィジェット共通: 乱数、SD 1.5 と cosine のノイズスケジュール、canvas の解像度合わせ、状態の保存と復元
const $ = (id) => document.getElementById(id);
function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function gauss(r) { const u = Math.max(r(), 1e-12), v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
const T = 1000;
// SD 1.5: scaled linear（β の平方根を 0.00085→0.012 で線形に並べて 2 乗）
const ABAR_SD = (() => { const a = []; let p = 1; const b0 = Math.sqrt(0.00085), b1 = Math.sqrt(0.012); for (let i = 0; i < T; i++) { const b = (b0 + (b1 - b0) * i / (T - 1)) ** 2; p *= 1 - b; a.push(p); } return a; })();
// cosine（Nichol & Dhariwal 2021、s = 0.008、β ≤ 0.999）
const ABAR_COS = (() => { const f = (t) => Math.cos((t / T + 0.008) / 1.008 * Math.PI / 2) ** 2; const a = []; let p = 1; for (let i = 0; i < T; i++) { p *= 1 - Math.min(1 - f(i + 1) / f(i), 0.999); a.push(p); } return a; })();
function fitCanvas(c) {
  const r = c.getBoundingClientRect(), d = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(r.width * d)), h = Math.max(1, Math.round(r.height * d));
  if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
  const g = c.getContext("2d"); g.setTransform(d, 0, 0, d, 0, 0);
  return { g, w: r.width, h: r.height };
}
const fmt = (v, n = 0) => v.toLocaleString("en-US", { minimumFractionDigits: n, maximumFractionDigits: n });
function segment(el, onPick) {
  el.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => { setSeg(el, b.dataset.v); onPick(b.dataset.v); }));
}
function setSeg(el, v) { el.querySelectorAll("button").forEach((b) => { const on = b.dataset.v === String(v); b.classList.toggle("on", on); b.setAttribute("aria-pressed", String(on)); }); }
// アプリに状態を預け、読み直したときに戻す（deck-studio:widget-state / widget-restore）
let publishing = false;
function publish(state) { if (publishing && parent !== window) parent.postMessage({ type: "deck-studio:widget-state", state }, "*"); }
function onRestore(fn) {
  window.addEventListener("message", (e) => {
    if (e.source !== parent || e.data?.type !== "deck-studio:widget-restore" || !e.data.state) return;
    const p = publishing; publishing = false; fn(e.data.state); publishing = p;
  });
}
function ready() { publishing = true; if (parent !== window) parent.postMessage({ type: "deck-studio:widget-ready" }, "*"); }

{ const r = rng(7); for (let i = 0; i < eps.length; i++) eps[i] = gauss(r); }
